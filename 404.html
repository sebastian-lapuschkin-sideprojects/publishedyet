<title>publishedyet</title>
<script>
  // GitHub Pages shows this page for any address it has no file for. That makes links like
  // .../publishedyet/2402.05602,1509.06321 possible: hand the ids over to the main page.
  var base = '/publishedyet/';
  var path = location.pathname;
  var ids = path.indexOf(base) === 0 ? path.slice(base.length) : '';
  location.replace(base + (ids ? '#' + ids : ''));
</script>
