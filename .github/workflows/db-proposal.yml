# Turns a database proposal (an issue made from the db-entry template) into a pull request.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
#
# Anybody with a GitHub account can propose; the last barrier is the merge, which only people
# with write access to the repository (the owner and collaborators) can do.
name: database proposal
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  propose:
    if: contains(github.event.issue.labels.*.name, 'db-proposal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write the entry into the database
        id: entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          PR_BODY: ${{ runner.temp }}/pr_body.md
        run: python cli.py from-issue 2> problems.txt
      - name: Update the demo and run the tests
        run: |
          python cli.py fix demo/refs.bib -o demo/refs_fixed.bib --preprint-style scholar > /dev/null
          python -m unittest discover tests
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          PR_BODY: ${{ runner.temp }}/pr_body.md
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "db/issue-$NUMBER"
          git add db demo
          if ! git diff --cached --quiet -- demo; then
            printf '\nAlso refreshes `demo/refs_fixed.bib`, which uses this entry.\n' >> "$PR_BODY"
          fi
          printf '\nProposed in #%s. Closes #%s.\n' "$NUMBER" "$NUMBER" >> "$PR_BODY"
          git commit -m "$TITLE (#$NUMBER)"
          git push --force origin "db/issue-$NUMBER"
          # a new pull request, or (issue edited) the existing one with new title and text
          gh pr create --title "$TITLE" --body-file "$PR_BODY" || gh pr edit "db/issue-$NUMBER" --title "$TITLE" --body-file "$PR_BODY"
      - name: Tell the proposer what is wrong
        if: failure() && steps.entry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$NUMBER" --body-file problems.txt
